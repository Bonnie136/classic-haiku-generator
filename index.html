<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <title>AI Haiku Generator</title>
  </head>
  <body>
    <div class="container">
      <h1>AI Haiku Generator</h1>
      <main>
        <form id="haiku-form-submit" class="form">
          <input
            type="text"
            placeholder="Inspiration for your Haiku"
            autofocus
            required
            class="form-input"
            id="form-input"
          />
          <input type="submit" class="form-submit" />
        </form>
        <div id="haiku" class="haiku hidden"></div>
      </main>
      <footer>
        This project was coded by
        <a href="https://github.com/Bonnie136" target="_blank">Bonnie Wells</a>,
        open sourced
        <a
          href="https://github.com/Bonnie136/classic-haiku-generator"
          target="_blank"
          >on GitHub</a
        >
        and is hosted
        <a
          href="https://69f72f4fd627f182f4e6bdfd--classichaikugenerator.netlify.app/"
          target="_blank"
          >on Netlify</a
        >.
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
