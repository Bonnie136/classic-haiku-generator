<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>Classic Haiku Generator</title>
  </head>
  <body>
    <div class="container">
      <h1>Classic AI Haiku Generator</h1>
      <main>
        <div class="form">
          <input
            type="text"
            placeholder="Inspiration for your Haiku"
            autofocus
            required
            class="form-input"
          />
          <input type="submit" class="form-submit" />
        </div>
        <div class="haiku">Haiku here</div>
      </main>
      <footer>

        open sourced
        <a
          href="https://github.com/Bonnie136/classic-haiku-generator"
          target="_blank"
          >on GitHub</a
        >
        and is hosted
        <a
          href="https://69f72f4fd627f182f4e6bdfd--classichaikugenerator.netlify.app/"
          target="_blank"
          >on Netlify</a
        >.
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
